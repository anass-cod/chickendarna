
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
    <link rel="shortcut icon" href="../imgs/Logo.png" type="image/x-icon">
    <link rel="stylesheet" href="./menu.css">
    <title>القائمة | Chicken Darna</title>
</head>

<body>

    <header>
        <button onclick="location.href='../Home/ChickenDarna.html'" class="back-btn">
            <i class="fa-solid fa-arrow-right"></i>
        </button>
        <h2>قائمة Chicken Darna</h2>
    </header>

    <div id="error-container" class="error-container" role="alert">
        <i class="fas fa-exclamation-circle"></i>
        <p>حدث خطأ، يرجى المحاولة مرة أخرى.</p>
        <button type="button" aria-label="إغلاق رسالة الخطأ" onclick="closeAlret()">
            &times;
        </button>
    </div>

    <section>

        <nav>
            <div class="search-content">
                <input type="text" id="search" placeholder="ابحث عن طبق..." onkeyup="isFidevalue()">
                <button onclick="debutSearch()">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>

            <button onclick="location.href='../panier/panier.html'" class="cart-btn">
                <i class="fa-solid fa-cart-shopping"></i>
            </button>

            <div class="content-alert">
                <div class="alert" id="alert">
                    تمت إضافة الطبق إلى السلة!
                </div>
            </div>
        </nav>

        <div id="cards" class="cards"></div>

    </section>

    <script src="./menu.js"></script>
    <script src="../Ensemble.js"></script>

</body>
</html>
